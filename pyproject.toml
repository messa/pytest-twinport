[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-twinport"
version = "0.2.0"
description = "Pytest plugin that leases free TCP/UDP ports without race conditions between parallel test runs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Petr Messner" }]
requires-python = ">=3.11"
dependencies = ["pytest>=7"]
keywords = ["pytest", "port", "free port", "unused port", "e2e", "xdist"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/messa/pytest-twinport"
Issues = "https://github.com/messa/pytest-twinport/issues"

[project.entry-points.pytest11]
twinport = "pytest_twinport.plugin"

[dependency-groups]
dev = ["mypy>=1.0", "pytest-xdist>=3.0", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_twinport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p pytester"
filterwarnings = ["error"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.mypy]
files = ["src"]
strict = true
